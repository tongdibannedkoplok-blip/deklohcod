<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deklohcod Editor</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* ================= LOADING SCREEN ================= */
.loading-screen{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
    gap:20px;
}

.loading-title{
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    position:relative;
    color:#38bdf8;
    animation:glitch 1s infinite;
}

.loading-bar{
    width:220px;
    height:6px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
}

.loading-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#38bdf8,#22c55e);
    animation:loading 2.5s linear forwards;
}

@keyframes loading{
    to{width:100%}
}

@keyframes glitch{
    0%{text-shadow:2px 0 red,-2px 0 cyan}
    25%{text-shadow:-2px 0 red,2px 0 cyan}
    50%{text-shadow:2px 2px red,-2px -2px cyan}
    75%{text-shadow:-2px 2px red,2px -2px cyan}
    100%{text-shadow:0 0 10px #38bdf8}
}

/* ================= MAIN ================= */
.editor{
    width:50%;
    display:flex;
    flex-direction:column;
    padding:10px;
    gap:10px;
    box-sizing:border-box;
    border-right:2px solid #1e293b;
}

.logo-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:#020617;
    border-radius:12px;
    gap:8px;
    box-shadow:0 0 25px rgba(56,189,248,0.2);
}

.logo-area img{
    max-width:80px;
    max-height:80px;
    object-fit:contain;
    animation:spin 12s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.logo-name{
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    color:#38bdf8;
    position:relative;
    animation:glitch 1.5s infinite;
}

.logo-underline{
    width:80px;
    height:3px;
    border-radius:10px;
    background:linear-gradient(90deg,#38bdf8,#22c55e);
    box-shadow:0 0 10px #38bdf8;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scaleX(1)}
    50%{transform:scaleX(1.3)}
    100%{transform:scaleX(1)}
}

.editor-wrapper{
    flex:1;
    display:flex;
    background:#020617;
    border-radius:10px;
    overflow:hidden;
}

.line-numbers{
    background:#020617;
    color:#64748b;
    padding:12px 6px;
    text-align:right;
    font-family:monospace;
    font-size:14px;
    user-select:none;
    border-right:1px solid #1e293b;
    min-width:40px;
}

textarea{
    flex:1;
    background:#020617;
    color:#38bdf8;
    border:none;
    padding:12px;
    font-family:monospace;
    font-size:14px;
    resize:none;
    outline:none;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#38bdf8;
    font-weight:bold;
}

iframe{
    width:50%;
    border:none;
    background:white;
}

.title{
    font-weight:bold;
    font-size:18px;
}
</style>
</head>

<body>

<div class="loading-screen" id="loading">
    <div class="loading-title">DEKLOHCOD</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<div class="editor">

    <div class="logo-area">
        <img id="logoPreview" src="" alt="logo">
        <div class="logo-name">deklohcod</div>
        <div class="logo-underline"></div>
    </div>

    <label>Upload logo:</label>
    <input type="file" accept="image/*" onchange="uploadLogo(event)">

    <div class="title">Editor Coding</div>

    <div class="editor-wrapper">
        <div class="line-numbers" id="lines">1</div>
        <textarea id="code" spellcheck="false"><h1>Halo dunia!</h1>
<p>Kamu bisa upload gambar lalu langsung muncul di sini.</p></textarea>
    </div>

    <button onclick="runCode()">Jalankan Kode</button>
    <button onclick="downloadHTML()">Download Hasil HTML</button>

    <label>Upload gambar ke kode:</label>
    <input type="file" accept="image/*" onchange="uploadImage(event)">
</div>

<iframe id="preview"></iframe>

<script>
const textarea = document.getElementById('code');
const lines = document.getElementById('lines');
const logoPreview = document.getElementById('logoPreview');

// loading hilang otomatis
setTimeout(()=>{
    document.getElementById('loading').style.display='none';
},2600);

function updateLines(){
    const count = textarea.value.split('\n').length;
    let numbers='';
    for(let i=1;i<=count;i++) numbers+=i+'<br>';
    lines.innerHTML=numbers;
}

textarea.addEventListener('input', updateLines);
textarea.addEventListener('scroll', ()=> lines.scrollTop=textarea.scrollTop);
updateLines();

function runCode(){
    document.getElementById('preview').srcdoc=textarea.value;
}

function uploadImage(event){
    const file=event.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{
        textarea.value+='\n<img src="'+e.target.result+'" style="max-width:300px;">';
        updateLines();
    }
    reader.readAsDataURL(file);
}

function uploadLogo(event){
    const file=event.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>logoPreview.src=e.target.result;
    reader.readAsDataURL(file);
}

function downloadHTML(){
    const blob=new Blob([textarea.value],{type:'text/html'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='hasil_koding.html';
    a.click();
}
</script>

</body>
</html>
